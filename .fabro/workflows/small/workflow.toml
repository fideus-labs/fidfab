# fidfab `small`
# Small development implementation: one-shot prompt, Claude Code implements, full verification pipeline, PR and steward loop.
#
# Run from a checkout of the target repository (the workflow is discovered
# from .fabro/workflows when fidfab is vendored or subtree'd there), or
# reference it remotely:
#   fabro run small --environment fidfab --goal "…" -I plan_slug=2026-10-24-my-task
#   fabro run fideus-labs/fidfab:small --environment fidfab --goal-file task.md --target OWNER/REPO@branch
_version = 1

[workflow]
graph = "workflow.fabro"

# Default model for Fabro-native nodes: Gemini 3.8 Flash on Vertex AI, routed
# through the local LiteLLM proxy. The model ID is declared by the server's
# ~/.fabro/settings.toml (`scripts/setup.sh litellm`, README step 2). The
# Claude Code and Codex stages (backend="acp") use their own subscriptions and
# ignore this.
[run.model]
name = "vertex-gemini-3.8-flash"
provider = "litellm"

# Gemini runs at medium reasoning effort.
# Claude Code and Codex stages take theirs from --effort on acp.command.
[run.model.controls]
reasoning_effort = "medium"

# The goal is the task text; supply it per run with --goal or --goal-file.
# Everything below is a workflow-owned default; override inputs with -I key=value.
[run.inputs]
# Directory (relative to the repository root) for planning artifacts:
# task_plan.md / findings.md / progress.md, or the roadmap documents.
plans_dir = "docs/plans"
# Sub-directory for this task's artifacts, e.g. -I plan_slug=2026-10-24-chunk-cache.
# Left at "task", a run started from a topic branch (not main, master, dev, release, …)
# uses <date>-<branch> instead, e.g. 2026-11-10-chunk-cache, with "/" replaced by "-".
plan_slug = "task"
# Open the pull request as a draft ("true" / "false").
draft_pr = "false"
# Review comments are untrusted input to an agent that holds this run's credentials: anyone
# can comment on a public pull request. With "true" the PR steward shows each unresolved
# thread (author, quoted text) to a human before any agent reads it, and again before it
# posts replies or pushes. Set "false" only for private repositories where every commenter
# is trusted (-I steward_gate=false).
steward_gate = "true"

# ---------------------------------------------------------------------------
# Sandbox: the locally built fidfab image (see README "Build the image").
# The [environments.fidfab] table below only serves `fabro validate` on this
# machine: Fabro never sends [environments.*] to the server, and `fabro run`
# ignores the id below unless it is also passed as `--environment fidfab`
# (Fabro 0.396). The server needs the same environment in its catalog
# (`scripts/setup.sh environment`). Otherwise Fabro silently uses its default
# image, where the first stage fails with "fidfab-bootstrap: command not found".
# ---------------------------------------------------------------------------
[run.environment]
id = "fidfab"

[environments.fidfab]
provider = "docker"

[environments.fidfab.image]
docker = "fidfab:latest"

[environments.fidfab.lifecycle]
preserve = false
stop_on_terminal = true

# Agent credentials are resolved from the Fabro vault when the run starts and
# injected into the sandbox environment. They never appear in workflow text,
# events or logs. Create them with `fabro secret set NAME` (see README).
[run.environment.env]
CLAUDE_CODE_OAUTH_TOKEN = "{{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}"
CODEX_AUTH_JSON_B64     = "{{ secrets.CODEX_AUTH_JSON_B64 }}"
CODERABBIT_API_KEY      = "{{ secrets.CODERABBIT_API_KEY }}"

# GitHub access for the sandbox. Under Fabro's GitHub App strategy each run gets
# a one-hour token for its repository with exactly these permissions, and the
# App must grant all of them or runs fail at their first stage: Fabro registers
# its App without actions and statuses, so add both (docs/github-token.md). The
# token strategy passes the vault's GITHUB_TOKEN as is and ignores this table.
[run.integrations.github.permissions]
contents      = "write"  # clone, push, force-push the rewritten history
pull_requests = "write"  # open and edit the PR, reply to and resolve review threads
issues        = "write"  # gh pr comment
checks        = "read"   # check runs: fidfab-pr-status, gh pr checks
statuses      = "read"   # commit statuses: fidfab-pr-status, gh pr checks
actions       = "read"   # gh run view --log-failed
metadata      = "read"

# Fabro clones the target repository into the sandbox (depth 100);
# fidfab-bootstrap deepens the history and attaches the image's warm caches.
[run.clone]
enabled = true
