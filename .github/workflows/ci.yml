name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_image:
        description: "Build the Docker image (slow)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate workflows and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Fabro (latest pre-release)
        run: |
          curl -fsSL https://fabro.sh/install.sh | bash
          echo "$HOME/.fabro/bin" >> "$GITHUB_PATH"
          "$HOME/.fabro/bin/fabro" upgrade --prerelease --no-upgrade-check
          "$HOME/.fabro/bin/fabro" --version
      - name: Vendored components are in sync
        run: scripts/sync-components.sh --check
      - name: fabro validate
        run: tests/validate-workflows.sh
      - name: shellcheck
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck >/dev/null
          shellcheck -S warning scripts/*.sh tests/*.sh docker/build.sh docker/rootfs/usr/local/bin/fidfab-*
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --check
        run: node --check tests/acp-smoke.mjs
      - name: Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: warning
          config: .hadolint.yaml

  image:
    name: Build image and run tool tests
    if: github.event_name == 'workflow_dispatch' && inputs.build_image
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Build fidfab:latest
        run: docker/build.sh
      - name: Tool and ACP handshake tests (unauthenticated)
        run: tests/test-image.sh fidfab:latest tools claude-acp codex-acp coderabbit
